name: Keep the site awake

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes: Render free sleeps after 15 min without visits
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the site
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://english-steps-app.onrender.com' }}
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$SITE_URL/api/health" || true)
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "Site did not answer with 200"
          exit 1
